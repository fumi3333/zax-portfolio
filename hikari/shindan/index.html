function calcHikariShindan() {
  const carrier = document.querySelector('input[name="carrier"]:checked').value;

  resDiv.style.display = 'block';

  if (priority === 'speed') {
    resTitle.innerText = '診断結果：独自回線の「NURO光」がベストです';
    resDesc.innerText = '下り最大2Gbpsの独自光ファイバー網により、混雑時間帯でも圧倒的な低ping値と超高速通信を実現します。マンション実質2,090円/月とコスパも最強です。';
    resService.innerHTML = '<strong>おすすめ回線：NURO光</strong>（最大60,000円キャッシュバック / 工事費実質無料）';
    resLink.href = 'https://www.nuro.jp/';
  } else if (priority === 'nobound' || carrier === 'sim') {
    resTitle.innerText = '診断結果：契約縛りなしの「GMOとくとくBB光」がベストです';
    resDesc.innerText = '格安SIMやahamoユーザーはスマホセット割がないため、基本料そのものが格安で違約金ゼロのGMO光が最もお得です。高額キャッシュバックも併用可能です。';
    resService.innerHTML = '<strong>おすすめ回線：GMOとくとくBB光</strong>（縛りなし違約金0円 / 最大128,000円還元）';
    resLink.href = 'https://gmobb.jp/service/gmohikari/';
  } else if (carrier === 'docomo') {
    resTitle.innerText = '診断結果：スマホ1台あたり最大1,100円引の「ドコモ光」がベストです';
    resDesc.innerText = 'ドコモユーザーは「ドコモ光セット割」が永年適用されます。GMOとくとくBB窓口から申し込むことで最大50,000円キャッシュバックとWi-Fiルーター無料レンタルが付きます。';
    resService.innerHTML = '<strong>おすすめ回線：ドコモ光（GMOとくとくBB）</strong>（dポイントプレゼント / 工事費完全無料）';
    resLink.href = 'https://gmobb.jp/service/docomohikari/';
  } else if (carrier === 'softbank') {
    resTitle.innerText = '診断結果：おうち割光セットが使える「SoftBank光」がベストです';
    resDesc.innerText = 'ソフトバンクやワイモバイルをご利用なら、毎月の携帯代が安くなるSoftBank光一択です。他社違約金の満額補填（最大10万円）も強力です。';

    resLink.href = 'https://softbank-hikari.jp/';

    resLink.href = 'https://kddi-hikari.com/';
  }
}
