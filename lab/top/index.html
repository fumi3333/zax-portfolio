<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ZAX｜試作（トップの作り直し）</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Noto+Sans+JP:wght@400;500&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F3F1EC; --sheet:#FBFAF7; --ink:#191917; --sub:#5F5D57; --faint:#A3A09A;
  --hair:rgba(25,25,23,.14); --hair2:rgba(25,25,23,.32); --mark:#B23A1C;
  --min:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --serif:"Instrument Serif",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --pad:clamp(1rem,3.6vw,3.25rem);
}
@media (prefers-color-scheme:dark){:root{
  --paper:#121211; --sheet:#181816; --ink:#ECEAE4; --sub:#A29F98; --faint:#68665F;
  --hair:rgba(236,234,228,.13); --hair2:rgba(236,234,228,.3); --mark:#E07A5A;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.9;
  font-feature-settings:"palt" 1;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{display:block;max-width:100%;height:auto}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
.page{padding:0 var(--pad)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(.75rem,1.6vw,1.5rem)}

/* 上端 */
.bar{display:flex;justify-content:space-between;align-items:center;height:56px;border-bottom:1px solid var(--hair)}
.logo{font-family:var(--serif);font-size:26px;letter-spacing:.02em;text-decoration:none;line-height:1}
.bar nav{display:flex;gap:clamp(1rem,3vw,2.25rem)}
.bar nav a{text-decoration:none}
.bar nav a:hover{color:var(--mark)}

/* 冒頭 */
.hero{padding:clamp(4rem,11vw,9.5rem) 0 clamp(3rem,7vw,5.5rem);border-bottom:1px solid var(--hair2)}
.hero h1{grid-column:1/10;margin:0;word-break:auto-phrase;font-family:var(--min);font-weight:500;font-size:clamp(2.3rem,6.4vw,6.2rem);line-height:1.22;letter-spacing:.01em}
.hero h1 em{font-style:normal;color:var(--mark)}
.hero .lead{grid-column:1/7;margin:clamp(2rem,4vw,3rem) 0 0;color:var(--sub);font-size:15px}
.spec{grid-column:9/13;align-self:end;margin:0;border-top:1px solid var(--hair2)}
.spec div{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--hair)}
.spec dt{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
.spec dd{margin:0;font-size:13px;text-align:right}

/* 一覧（並べ替えられる表） */
.ix-head{display:flex;justify-content:space-between;align-items:end;padding:clamp(3rem,6vw,4.5rem) 0 .9rem}
.ix-head h2{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,4.5vw,3.6rem);line-height:1;letter-spacing:-.01em}
.ix-head h2 small{font-family:var(--min);font-size:.42em;margin-left:.6em;vertical-align:.35em;color:var(--sub);letter-spacing:.05em}
.ix{width:100%;border-collapse:collapse;table-layout:fixed}
.ix th{padding:0;border-top:1px solid var(--hair2);border-bottom:1px solid var(--hair2);text-align:left;font-weight:400}
.ix th button{all:unset;cursor:pointer;display:block;width:100%;padding:.65rem 0;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
.ix th button:hover,.ix th button[aria-sort]{color:var(--ink)}
.ix th button::after{content:"";display:inline-block;width:.9em;margin-left:.35em;color:var(--mark)}
.ix th button[aria-sort="ascending"]::after{content:"↑"}
.ix th button[aria-sort="descending"]::after{content:"↓"}
.ix td{padding:1.05rem 0;border-bottom:1px solid var(--hair);vertical-align:baseline}
.ix tr.row{cursor:pointer}
.ix tr.row:hover td,.ix tr.row:focus-within td{background:var(--sheet)}
.ix .c-no{width:7%;font-family:var(--mono);font-size:12px;color:var(--faint)}
.ix .c-nm{width:30%}
.ix .c-nm a{font-family:var(--min);font-weight:500;font-size:clamp(1.15rem,1.9vw,1.6rem);line-height:1.35;text-decoration:none}
.ix tr.row:hover .c-nm a{color:var(--mark)}
.ix .c-what{width:47%;color:var(--sub);padding-right:1.5rem}
.ix .c-f{width:16%;font-size:13px;text-align:right}
.ix .c-d{width:11%;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.ix .c-s{width:11%;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;text-align:right}
.ix .c-s i{font-style:normal;display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:.5em;vertical-align:.1em}
.ix .live{color:var(--ink)}.ix .dev{color:var(--faint)}
.ix th.c-f button{text-align:right}

/* 表の上に重ねる画面の見本（パソコン幅だけ） */
.peek{position:fixed;right:var(--pad);bottom:var(--pad);width:min(30vw,420px);margin:0;pointer-events:none;opacity:0;background:var(--sheet);border:1px solid var(--hair2);padding:8px 8px 6px;box-shadow:0 18px 40px rgba(0,0,0,.12);z-index:5}
.peek.on{opacity:1}
.peek img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top}
.peek figcaption{margin-top:6px}

/* 作品ごと */
.work{padding:clamp(3.5rem,7vw,6rem) 0;border-bottom:1px solid var(--hair);scroll-margin-top:1rem}
.work .meta{grid-column:1/4;display:flex;flex-direction:column;gap:.35rem}
.work .meta .n{font-family:var(--serif);font-size:clamp(3rem,6vw,5.5rem);line-height:.9;color:var(--faint)}
.work .txt{grid-column:4/8}
.work h3{margin:0 0 .25rem;font-family:var(--min);font-weight:600;font-size:clamp(1.6rem,2.8vw,2.4rem);line-height:1.35}
.work .what{margin:0 0 1.4rem;word-break:auto-phrase;font-family:var(--min);font-size:1.05rem;color:var(--sub)}
.work .txt p{margin:0 0 1em}
.work .go{display:inline-block;margin-top:.6rem;font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-decoration:none;border-bottom:1px solid var(--hair2);padding-bottom:2px}
.work .go:hover{color:var(--mark);border-color:var(--mark)}
.work figure{grid-column:8/13;margin:0;align-self:start}
.work figure a{display:block;background:var(--sheet);border:1px solid var(--hair2);padding:8px}
.work figure img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top}
.work figcaption{margin-top:.6rem;display:flex;justify-content:space-between}

/* 事業概要・連絡先 */
.sec{padding:clamp(3.5rem,7vw,6rem) 0;border-bottom:1px solid var(--hair2)}
.sec h2{grid-column:1/4;margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(2rem,3.6vw,3rem);line-height:1}
.sec h2 small{display:block;font-family:var(--min);font-size:.4em;margin-top:.8em;color:var(--sub);letter-spacing:.05em}
.sec .body{grid-column:4/13}
.facts{width:100%;border-collapse:collapse}
.facts th,.facts td{text-align:left;padding:.85rem 0;border-bottom:1px solid var(--hair);font-weight:400;vertical-align:top}
.facts tr:first-child th,.facts tr:first-child td{border-top:1px solid var(--hair2)}
.facts th{width:22%;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);padding-top:1.05rem}
.mail{font-family:var(--serif);font-size:clamp(1.8rem,4.6vw,3.8rem);line-height:1.1;text-decoration:none;word-break:break-all}
.mail:hover{color:var(--mark)}
.sec .note{margin:1.5rem 0 0;color:var(--sub)}
footer{display:flex;justify-content:space-between;align-items:end;padding:2rem 0 2.5rem}
footer .big{font-family:var(--serif);font-size:clamp(3rem,12vw,10rem);line-height:.8;letter-spacing:-.02em}

@media (max-width:900px){
  .hero h1,.hero .lead,.spec{grid-column:1/-1}
  .spec{margin-top:2.5rem}
  .ix .c-what,.ix .c-f,.ix th.c-what,.ix th.c-f{display:none}
  .ix .c-no{width:14%}.ix .c-nm{width:86%}
  .peek{display:none}
  .work .meta,.work .txt,.work figure{grid-column:1/-1}
  .work .meta{flex-direction:row;justify-content:space-between;align-items:baseline;margin-bottom:1rem}
  .work figure{margin-top:1.5rem}
  .sec h2,.sec .body{grid-column:1/-1}
  .sec h2{margin-bottom:1.5rem}
}
@media (max-width:520px){
  .bar nav a:not(:last-child){display:none}
  .ix .c-s{font-size:10px}
}
@media (prefers-reduced-motion:no-preference){.peek{transition:opacity .12s linear}}
</style>
</head>
<body>
<div class="page">
<header class="bar">
  <a class="logo" href="/">ZAX</a>
  <nav class="mono" aria-label="ページ内"><a href="#index">Index</a><a href="#about">About</a></nav>
</header>

<section class="hero grid">
  <h1>人が、新しい土地で<em>仲間と出会う</em>きっかけをつくる。</h1>
  <p class="lead">そのための入口として、リゾートバイトの求人や全国の公有地など、各社や自治体に散らばった情報を集め、条件を比べて選べるWebサービスにしています。</p>
  <dl class="spec">
    <div><dt>Name</dt><dd>ZAX（個人事業）</dd></div>
    <div><dt>Founder</dt><dd>松田 晴史</dd></div>
  </dl>
</section>

<section id="index">
  <div class="ix-head">
    <h2>Index<small>作ったもの</small></h2>
    <span class="mono">見出しを押すと並べ替えます</span>
  </div>
  <table class="ix" id="ix">
    <thead><tr>
      <th class="c-no"><button data-k="no">No.</button></th>
      <th class="c-nm"><button data-k="nm">Name</button></th>
      <th class="c-what"><button data-k="what">What</button></th>
      <th class="c-f"><button data-k="f">Field</button></th>
    </tr></thead>
    <tbody></tbody>
  </table>
</section>

<figure class="peek" id="peek" aria-hidden="true"><img alt="" id="peek-img"><figcaption class="mono" id="peek-cap"></figcaption></figure>


<section id="about" class="sec grid">
  <h2>About<small>事業概要</small></h2>
  <div class="body">
    <table class="facts">
      <tr><th>屋号</th><td>ZAX</td></tr>
      <tr><th>代表</th><td>松田 晴史（<a href="/profile/">プロフィール</a>）</td></tr>
      <tr><th>事業形態</th><td>個人事業</td></tr>
      <tr><th>事業内容</th><td>Webサービスの企画・開発・運用</td></tr>
    </table>
  </div>
</section>


<footer><span class="big">ZAX</span></footer>
</div>

<script>
// 作品のデータ。一覧・詳細はここから作る（文章と表で数字や名前がずれないように）
var W=[
 {id:"resort",nm:"リゾートソート",what:"リゾートバイト求人を、時給・寮・食事で比べる",f:"仕事",url:"/resort/",host:"fumiproject.dev/resort/",
  body:["派遣会社ごとに分かれているリゾートバイトの求人を、時給・寮・食事・期間などの同じ項目で比べられる検索サイトです。各社の公開求人を毎日確かめ、募集が終わったものは外しています。","集めた求人は、会社名や施設名が分からない形に集計し、月ごとの<a href=\"/resort/research/\">労働条件レポート</a>としても公開しています。"]},
 {id:"koyuchi",nm:"公有地ソート",what:"全国の公有地・廃校の売却・貸付・公募を一覧に",f:"土地",url:"/koyuchi/",host:"fumiproject.dev/koyuchi/",
  body:["自治体や財務局のページに散らばっている、公有地や公共施設の売却・貸付・公募の情報を毎日集めて、一つの一覧で探せるようにしています。掲載が確認できなくなったものは外します。","廃校施設の活用募集は、<a href=\"/haikou/\">廃校の物件検索</a>でも探せます。"]},
 {id:"menkyo",nm:"合宿免許ソート",what:"合宿免許のプランを、入校日と料金で比べる",f:"免許",url:"/menkyo/",host:"fumiproject.dev/menkyo/",
  body:["大手の予約サイトに分かれている合宿免許のプランを、入校日・料金・部屋タイプなどの同じ項目で比べられる検索サイトです。カレンダーから、日ごとの最安値と空き状況を確かめられます。"]},
 {id:"jiritsu",nm:"自立支援医療の申請書をつくる",what:"病院と薬局を選ぶと、申請書と宛名ラベルを印刷",f:"医療",url:"/jiritsu/",host:"fumiproject.dev/jiritsu/",
  body:["通っている病院と薬局を選ぶと、東京都の申請書と封筒の宛名ラベルをA4で印刷できます。医療機関のコードと提出先は自動で印字し、お名前やご住所は印刷した紙に手書きします。ページには個人情報の入力欄がありません。","東京都が公開している指定医療機関の一覧（オープンデータ）を使っています。"]},
 {id:"musalink",nm:"Musalink",what:"大学の教科書BOXの在庫を、スマホで見る",f:"大学",url:"/musalink/",host:"fumiproject.dev/musalink/",
  body:["武蔵野大学の教科書BOXに、どの本があるかをスマホで見られる在庫サイトです。使い終わった教科書を無料で置き、必要な人が持っていきます。","学生団体「武蔵野工房」（<a href=\"https://x.com/musashinotech\">@musashinotech</a>）のプロジェクトとして運営しています。"]}
];
W.forEach(function(w,i){w.no=i+1;w.img="/images/works/"+w.id+".jpg"});
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var pad=function(n){return(n<10?"0":"")+n};
var st={live:"Live",dev:"In dev"};


// 一覧（並べ替え）
var tb=document.querySelector("#ix tbody"), key="no", dir=1;
function draw(){
  var rows=W.slice().sort(function(a,b){var x=a[key],y=b[key];return(x>y?1:x<y?-1:a.no-b.no)*dir});
  tb.innerHTML=rows.map(function(w){
    return '<tr class="row" data-id="'+w.id+'"><td class="c-no">'+pad(w.no)+'</td><td class="c-nm"><a href="'+w.url+'">'+esc(w.nm)+'</a></td>'
     +'<td class="c-what">'+esc(w.what)+'</td><td class="c-f">'+esc(w.f)+'</td></tr>';
  }).join("");
  [].forEach.call(document.querySelectorAll("#ix th button"),function(b){
    if(b.dataset.k===key)b.setAttribute("aria-sort",dir>0?"ascending":"descending");else b.removeAttribute("aria-sort");
  });
}
[].forEach.call(document.querySelectorAll("#ix th button"),function(b){
  b.addEventListener("click",function(){ if(key===b.dataset.k)dir=-dir; else{key=b.dataset.k;dir=1} draw(); });
});
tb.addEventListener("click",function(e){var r=e.target.closest("tr.row");if(r&&e.target.tagName!=="A")location.href=W.filter(function(x){return x.id===r.dataset.id})[0].url});
draw();

// 行に乗せると、その作品の画面を右下に出す（パソコン幅だけ）
var pk=document.getElementById("peek"),pi=document.getElementById("peek-img"),pc=document.getElementById("peek-cap");
tb.addEventListener("mouseover",function(e){var r=e.target.closest("tr.row");if(!r)return;var w=W.filter(function(x){return x.id===r.dataset.id})[0];pi.src=w.img;pc.textContent=w.host;pk.classList.add("on")});
tb.addEventListener("mouseleave",function(){pk.classList.remove("on")});
</script>
</body>
</html>
